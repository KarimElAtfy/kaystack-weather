directory:
  - infra
framework:
  - terraform
compact: true
quiet: true
skip-download: true
skip-check:
  - CKV_AZURE_59   # storage public network access: no VNet, the runners and the Function have no fixed addresses, and visitors read the public account
  - CKV2_AZURE_33  # storage private endpoint: there is no VNet in this project
  - CKV2_AZURE_1   # customer-managed storage key: Microsoft-managed keys, and the state is also encrypted client side
  - CKV_AZURE_206  # geo-replication: state is ZRS and versioned; public and func are rebuilt from the repo and the lake, which is copied offline by hand
  - CKV_AZURE_33   # queue logging: no queues are used
  - CKV2_AZURE_21  # blob read logging: every pipeline and visitor read would be ingested, far past the daily log cap
  - CKV_AZURE_109  # vault firewall rules: GitHub-hosted runners have no fixed addresses
  - CKV_AZURE_189  # vault public network access: needed by the runners; data access is Entra RBAC only
  - CKV2_AZURE_32  # vault private endpoint: there is no VNet in this project
  - CKV_AZURE_19   # Defender standard tier: every plan is pinned to Free in governance.tf
  - CKV_AZURE_55   # Defender for Servers: there are no virtual machines
  - CKV_AZURE_61   # Defender for App Service: billed per instance, more than this project's whole budget
  - CKV_AZURE_69   # Defender for Azure SQL: there are no SQL databases
  - CKV_AZURE_79   # Defender for SQL on machines: there are no SQL servers
  - CKV_AZURE_84   # Defender for Storage: billed per account, more than this project's whole budget
  - CKV_AZURE_87   # Defender for Key Vault: left at Free with the other plans
  - CKV_AZURE_234  # Defender for Resource Manager: left at Free with the other plans
