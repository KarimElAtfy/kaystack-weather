name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: infra-prod
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    # Only main has a federated credential for the plan identity outside pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC sign-in as the plan identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
    outputs:
      count: ${{ steps.changes.outputs.count }}
      digest: ${{ steps.changes.outputs.digest }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        run: bash ../.github/install-tofu.sh

      - run: tofu init -input=false -lockfile=readonly -backend-config=prod.tfbackend -var-file=prod.tfvars
      - run: tofu plan -input=false -lock=false -var-file=prod.tfvars -out=prod.tfplan > /dev/null

      - id: changes
        name: Changes to review
        run: |
          tofu show -json -var-file=prod.tfvars prod.tfplan | jq -r -f ../.github/plan-changes.jq > "$RUNNER_TEMP/changes.txt"
          count=$(grep -c . "$RUNNER_TEMP/changes.txt" || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum < "$RUNNER_TEMP/changes.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          { echo "Prod plan for ${GITHUB_SHA:0:7}, $count resources:"; echo; echo '```'; cat "$RUNNER_TEMP/changes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC sign-in as the apply identity
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      REVIEWED_DIGEST: ${{ needs.plan.outputs.digest }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        run: bash ../.github/install-tofu.sh

      - run: tofu init -input=false -lockfile=readonly -backend-config=prod.tfbackend -var-file=prod.tfvars
      - run: tofu plan -input=false -var-file=prod.tfvars -out=prod.tfplan > /dev/null

      # The approval was given on the plan job's list. If the state or Azure
      # moved since then, this plan is different and nothing is applied.
      - name: Same changes as the reviewed plan
        run: |
          tofu show -json -var-file=prod.tfvars prod.tfplan | jq -r -f ../.github/plan-changes.jq > "$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt"
          digest=$(sha256sum < "$RUNNER_TEMP/changes.txt" | cut -d' ' -f1)
          if [ "$digest" != "$REVIEWED_DIGEST" ]; then
            echo "The plan changed after review. Run the workflow again and review the new list."
            exit 1
          fi

      - run: tofu apply -input=false -var-file=prod.tfvars prod.tfplan
