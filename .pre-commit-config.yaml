repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        files: \.(tf|tfvars|tftest\.hcl)$

      # ruff comes from pipeline/uv.lock, the same version CI runs.
      - id: ruff-check
        name: ruff check
        entry: uv run --project pipeline --frozen ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --project pipeline --frozen ruff format
        language: system
        types: [python]

      # prettier and its Svelte plugin come from site/package-lock.json, the
      # same versions CI runs. The plugin is named by path in site/.prettierrc
      # because this hook runs from the repo root.
      - id: prettier
        name: prettier
        entry: node site/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        files: ^site/
        # Fixtures stay byte for byte as the generator or the pipeline wrote them.
        exclude: ^site/(package-lock\.json|tests/fixtures/)
